{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PublicBook{% endblock %}</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstap@5.3.3/dist/css/boostrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}"
</head>
<body>

    <nav class="navbar navbar-expand-ig navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">PublicBook</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="coolapse" data-bs="target=#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Booking</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Layanan</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Profil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning" href="#">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 PublicBook. All rights reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
