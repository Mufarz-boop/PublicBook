<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PublicBook</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icons/Icon PublicBook.jpg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FF6B00, #FF8C00);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .error-icon {
            width: 100px;
            height: 100px;
            background: #FFEBEE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 48px;
            color: #D32F2F;
        }
        .error-card h2 { color: #333; margin-bottom: 10px; }
        .error-card p { color: #666; margin-bottom: 25px; }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #FF6B00, #FF8C00);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        <h2>Oops!</h2>
        <p>{{ message }}</p>
        <a href="{{ url_for('user_routes.dashboard') }}" class="btn-back">
            <i class="fas fa-home"></i> Kembali
        </a>
    </div>
</body>
</html>
