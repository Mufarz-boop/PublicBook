{% load static %}
<!-- <!DOCTYPE html> -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin PublicBook{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body class="bg-light">

<div class="d-flex">

    <div class="bg-dark text-white p-3 vh-100" style="width: 250px;">
        <h3 class="text-center mb-4">Admin Panel</h3>

        <ul class="nav flex-column">
            <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white">Booking List</a>
            </li>
            <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white">Layanan</a>
            </li>
            <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white">Security</a>
            </li>
            <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white">Profil</a>
            </li>
            <li class="nav-item mt-4">
                <a href="#" class="nav-link text-warning"Logout></a>
            </li>
        </ul>
    </div>

    <div class="flex-grow-1">

        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand mb-0 h4">PublicBook Admin</span>
        </nav>

        <div class="p-4">
            {% block content %}
            {% endblock %}
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
