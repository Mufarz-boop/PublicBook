<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Page - PublicBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 40%, #FFB347 70%, #FFD700 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ========== CONTAINER ========== */
        .profile-container {
            width: 100%;
            max-width: 900px;
            animation: fadeInUp 0.6s ease forwards;
        }

        /* ========== HEADER ========== */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .header-text h1 {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
            margin-bottom: 5px;
        }

        .header-text p {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* ========== PROFILE CARD ========== */
        .profile-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(255,107,0,0.08), rgba(255,140,0,0.05));
            border-radius: 50%;
            pointer-events: none;
        }

        /* ========== PROFILE TOP ========== */
        .profile-top {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .profile-avatar-wrap {
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .badge-admin {
            display: inline-block;
            padding: 5px 18px;
            background: linear-gradient(135deg, #FF8C42, #FFB347);
            color: #fff;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.3);
        }

        /* ========== INFO GRID ========== */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .info-box {
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: 14px;
            padding: 16px 20px;
            transition: all 0.3s ease;
        }

        .info-box:hover {
            border-color: #FF8C42;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.1);
            transform: translateY(-2px);
        }

        .info-label {
            font-size: 12px;
            font-weight: 500;
            color: #888;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        /* ========== ACTION BUTTONS ========== */
        .action-buttons {
            display: flex;
            gap: 15px;
            position: relative;
            z-index: 1;
        }

        .btn-action {
            flex: 1;
            padding: 14px 24px;
            background: linear-gradient(135deg, #FF8C42, #FFB347);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-text h1 {
                font-size: 28px;
            }

            .profile-card {
                padding: 25px;
            }

            .profile-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="profile-container">
        <!-- HEADER -->
        <div class="profile-header">
            <div class="header-text">
                <h1>Profil</h1>
                <p>Kelola Informasi Akun Anda</p>
            </div>
            <a href="../admin/dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </a>
        </div>

        <!-- PROFILE CARD -->
        <div class="profile-card">
            <!-- PROFILE TOP -->
            <div class="profile-top">
                <div class="profile-avatar-wrap">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=face" alt="Ms. Hutao" class="profile-avatar">
                </div>
                <div class="profile-info">
                    <h2 class="profile-name">Ms. Hutao</h2>
                    <span class="badge-admin">Administrator</span>
                </div>
            </div>

            <!-- INFO GRID -->
            <div class="info-grid">
                <div class="info-box">
                    <div class="info-label">Email</div>
                    <div class="info-value">hutao@gmail.com</div>
                </div>
                <div class="info-box">
                    <div class="info-label">No. HP</div>
                    <div class="info-value">+62 849-6391-7263</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Tanggal Bergabung</div>
                    <div class="info-value">15 April 2026</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Terakhir Login</div>
                    <div class="info-value">20 April 2026</div>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="action-buttons">
                <button class="btn-action">
                    <i class="fas fa-user-edit"></i>
                    <span>Edit Profil</span>
                </button>
                <a href="../admin/ubah_password.html" class="btn-action">
                    <i class="fas fa-lock"></i>
                    <span>Ubah Password</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
