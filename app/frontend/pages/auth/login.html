<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PublicBook</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/icons/Icon PublicBook.jpg ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>

  <!-- Card Horizontal -->
  <div class="login-card">

    <!-- Sisi Kiri: Foto Ruang Kerja -->
    <div class="card-left">
      <img src="../../assets/images/bg/login side.jpg" alt="Ruang Kerja Modern">
    </div>

    <!-- Sisi Kanan: Form Login -->
    <div class="card-right">

      <!-- Header: Logo Bulat Pure Image -->
      <div class="brand-header">
        <div class="logo-wrapper">
          <img src="../../assets/images/icons/Icon PublicBook.jpg" alt="PublicBook Logo">
        </div>
      </div>

      <!-- Heading -->
      <div class="login-heading">
        <h1>Welcome Back</h1>
        <p>Silahkan masuk ke akun anda</p>
      </div>

      <!-- Form -->
      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            placeholder="nama@gmail.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="Password anda" 
            required
            autocomplete="current-password"
          >
        </div>

        <div class="forgot-row">
          <a href="{{ url_for('auth_routes.forgot_password')}}" class="forgot-link">Lupa Password?</a>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          Masuk
        </button>

      </form>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">atau</span>
        <div class="divider-line"></div>
      </div>

      <!-- Register -->
      <div class="register-row">
        Belum punya akun? <a href="{{ url_for('auth_routes.register_page')}}">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
</body>
</html>
