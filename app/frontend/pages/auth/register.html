<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PublicBook</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/icons/Icon PublicBook.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/register.css">
</head>
<body>

  <!-- Card Horizontal -->
  <div class="register-card">

    <!-- Sisi Kiri: Foto Ruang Kerja -->
    <div class="card-left">
      <img src="../../assets/images/bg/login side.jpg" alt="Ruang Kerja Modern">
    </div>

    <!-- Sisi Kanan: Form Register -->
    <div class="card-right">

      <!-- Header: Logo + Brand Name (Left Aligned) -->
      <div class="brand-header">
        <div class="logo-wrapper">
          <img src="../../assets/images/icons/Icon PublicBook.jpg" alt="PublicBook Logo">
        </div>
        <span class="brand-name">
          <span class="text-public">Public</span><span class="text-book">Book</span>
        </span>
      </div>

      <!-- Subtitle (Center) -->
      <div class="register-subtitle">
        Silahkan isi untuk mendaftar
      </div>

      <!-- Form -->
      <form class="register-form" id="registerForm" onsubmit="handleRegister(event)">

        <div class="input-group">
          <i class="fas fa-user"></i>
          <input 
            type="text" 
            id="nama" 
            placeholder="Nama Lengkap" 
            required
            autocomplete="name"
          >
        </div>

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            placeholder="nama@gmail.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="input-group">
          <i class="fas fa-phone"></i>
          <input 
            type="tel" 
            id="telepon" 
            placeholder="Nomor telepon" 
            required
            autocomplete="tel"
          >
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="Password anda" 
            required
            autocomplete="new-password"
          >
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Ulangi password anda" 
            required
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          Daftar
        </button>

      </form>

      <!-- Login Link -->
      <div class="login-row">
        Sudah punya akun? <a href="{{ url_for('auth_routes.login_page')}}">Login</a>
      </div>

    </div>
  </div>

  <script src="/assets/js/register.js"></script>

</body>
</html>
